<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navi API demo</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script type="module" src="/assets/api-demo.js"></script>
</head>
<body>
  <main class="content">
    <header class="section-title">
      <h1>Navi API demo</h1>
      <p>Send a question to the Click HR API and see the JSON it returns.</p>
      <p><a href="/">Navi workspace</a> · <a href="/api/openapi.json">OpenAPI definition</a></p>
    </header>
    <section class="card editing-card" aria-label="API request">
      <form id="test-request" class="setup-form">
        <p><code>POST /api/bots/clickhr/chat</code></p>
        <label class="field"><span class="field-label">Message</span>
          <textarea name="message" rows="3" maxlength="1200" required>How much does Click HR cost for 50 employees?</textarea>
        </label>
        <label class="field"><span class="field-label">Reply language</span>
          <select name="language"><option value="auto">Auto</option><option value="en">English</option><option value="km">ខ្មែរ</option></select>
        </label>
        <label class="check-label"><input type="checkbox" name="followup" checked /> Use the previous reply as context</label>
        <button class="button primary" type="submit">Send API request</button>
      </form>
    </section>
    <section class="card editing-card" aria-label="API response">
      <h2>Response</h2>
      <p id="api-status" role="status">Send a request to see the response.</p>
      <pre id="api-response" class="api-response"></pre>
    </section>
  </main>
</body>
</html>
